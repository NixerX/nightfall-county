name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: nightfall-windows
          path: |
            build/Release/nightfall.exe
            build/Release/assets
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: nightfall-mac
          path: |
            build/nightfall
            build/assets
